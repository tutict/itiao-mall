name: itiao-mall-dev

services:
  pg:
    image: postgres:17-alpine
    container_name: itiao-pg
    environment:
      POSTGRES_USER: itiao
      POSTGRES_PASSWORD: itiao
      POSTGRES_DB: itiao
      # 压测时把日志压到最低，避免 WAL/日志本身成为瓶颈污染数字
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itiao -d itiao"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - synchronous_commit=off

  redis:
    image: redis:7.4-alpine
    container_name: itiao-redis
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
